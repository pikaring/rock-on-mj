name: goods

# Amazon Creators API で商品情報（画像・価格）を取り直し、変わっていればコミットする。
# 認証情報は Settings > Secrets の CREATORS_CLIENT_ID / CREATORS_CLIENT_SECRET。

on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 03:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch from Creators API
        env:
          CREATORS_CLIENT_ID: ${{ secrets.CREATORS_CLIENT_ID }}
          CREATORS_CLIENT_SECRET: ${{ secrets.CREATORS_CLIENT_SECRET }}
        run: python tools/fetch_goods.py --html docs/index.html --out docs/assets/goods.json
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/goods.json
          git diff --cached --quiet && echo "変更なし" || (git commit -m "goods.json を更新（Creators API）" && git push)
